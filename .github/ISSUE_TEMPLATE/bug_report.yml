name: Bug report
description: Report a bug in RepoNav (extension, CLI, MCP server, or GitHub Action)
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `reponav --version` or extension version from VS Code's Extensions panel
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Which RepoNav surface is affected?
      options:
        - VS Code extension
        - CLI (`npx reponav`)
        - MCP server
        - GitHub Action
        - Multiple
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      description: Operating system + version
      placeholder: "macOS 14.5 / Ubuntu 22.04 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal sequence to reproduce
      placeholder: |
        1. Clone https://github.com/foo/bar
        2. Run `npx reponav analyze . --tier 3`
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error output if any.
    validations:
      required: true
  - type: input
    id: repo
    attributes:
      label: Repo URL or minimal repro
      description: A public repo URL or attached minimal-repro zip helps a lot
      placeholder: "https://github.com/foo/bar (commit abc123)"
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else relevant
