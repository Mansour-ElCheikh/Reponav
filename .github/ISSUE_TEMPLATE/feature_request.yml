name: Feature request
description: Suggest a new capability for RepoNav
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Be concrete — describe a real situation, not a hypothetical.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed surface
      description: How would the feature appear? (CLI flag, MCP tool, extension command, action input, output format, etc.)
    validations:
      required: true
  - type: textarea
    id: deterministic
    attributes:
      label: Why analyzer-deterministic?
      description: |
        RepoNav is a deterministic architecture sensor. Why is this feature a good fit for that posture?
        If it requires LLM mediation, why isn't a separate tool a better home for it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workflows, or RepoNav features you tried before requesting this
  - type: textarea
    id: additional
    attributes:
      label: Additional context
